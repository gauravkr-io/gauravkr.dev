<!doctype html>
<html lang="en" class="no-js" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  {{meta}}

  <link rel="icon" href="/assets/images/icons/favicon.png" type="image/png" />
  <link rel="alternate" type="application/rss+xml" title="Gaurav Kumar" href="/rss.xml" />
  {{jsonld}}

  <script>
    (function () {
      try {
        var stored = localStorage.getItem('gk-theme');
        var theme = stored === 'light' || stored === 'dark'
          ? stored
          : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (error) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-grid.min.css" />
  <link rel="stylesheet" href="/assets/css/design-system.css" />
  <link rel="stylesheet" href="/assets/css/theme-light.css" />
  <link rel="stylesheet" href="/assets/css/theme-dark.css" />
  <link rel="stylesheet" href="/assets/css/styles.css" />
  <link rel="stylesheet" href="/assets/css/glass.css" />
  <link rel="stylesheet" href="/assets/css/hero-glass.css" />
</head>

<body data-page="blog-post">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="page-veil" aria-hidden="true"></div>

  <header class="site-header" id="site-header"></header>
  <div class="mobile-nav" id="mobile-nav"></div>

  <main id="main">
    <div id="page-error" hidden></div>

    <section class="page-head" id="page-head" aria-label="Post introduction" data-prerendered>{{pageHead}}</section>

    <section class="section" aria-label="Post">
      <div class="shell">
        <div id="post-body" data-prerendered>{{postBody}}</div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script type="module" src="/assets/js/main.js"></script>
</body>
</html>
