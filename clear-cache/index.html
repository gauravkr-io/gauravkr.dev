<!doctype html>
<html lang="en" class="no-js" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Clear saved copy | Gaurav Kumar</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0A0D26" />
  <link rel="icon" href="/assets/images/icons/favicon.png" type="image/png" />

  <script>
    (function () {
      try {
        var stored = localStorage.getItem('gk-theme');
        var theme = stored === 'light' || stored === 'dark'
          ? stored
          : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (error) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="/assets/css/design-system.css" />
  <link rel="stylesheet" href="/assets/css/theme-light.css" />
  <link rel="stylesheet" href="/assets/css/theme-dark.css" />
  <link rel="stylesheet" href="/assets/css/content-pages.css" />
</head>

<body class="links-page" data-page="clear-cache" data-chrome="none">
  <a class="skip-link" href="#main">Skip to content</a>

  <main class="links-shell" id="main">
    <div id="page-error" hidden></div>
    <div id="clear-root"></div>
  </main>

  <script type="module" src="/assets/js/main.js"></script>
</body>
</html>
